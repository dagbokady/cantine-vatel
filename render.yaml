# Blueprint Render : backend Cantine Vatel (le frontend est sur Vercel).
# Render > New > Blueprint > choisir ce dépôt. Les valeurs « sync: false » sont demandées à la création.
services:
  - type: web
    name: cantine-vatel-api
    runtime: python
    plan: free
    region: oregon # même région que la base : connexion interne rapide
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations à chaque déploiement. --proxy-headers : vraie IP du client (limite de connexions) et liens en https.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PRODUCTION
        value: "true"
      # Internal Database URL de ta base Render (postgresql://... ; le pilote psycopg est ajouté tout seul).
      - key: DATABASE_URL
        sync: false
      # Valeurs aléatoires générées par Render, jamais visibles dans le dépôt.
      - key: JWT_SECRET
        generateValue: true
      - key: TICKET_SIGNING_KEY
        generateValue: true
      # Adresse exacte du site Vercel, ex. https://cantine-vatel.vercel.app (plusieurs : séparées par des virgules).
      - key: CORS_ORIGINS
        sync: false
      - key: COMPTOIR_CONTROLE_CRENEAU
        value: "true"
      # Données de démonstration (comptes du README) chargées au démarrage si la base n'a encore aucun compte.
      # Une base déjà utilisée n'est jamais effacée. Passer à "false" pour une vraie mise en service.
      - key: SEED_DEMO
        value: "true"
      # E-mails « mot de passe oublié » (Brevo, ou Gmail avec un mot de passe d'application).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "Cantine Vatel <no-reply@cantine-vatel.ci>"
